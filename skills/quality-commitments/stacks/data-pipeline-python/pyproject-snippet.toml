# Snippet to merge into the project's pyproject.toml.
# Adjust line-length, target version, and exclude paths to match house style.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", ".venv", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = ["S101"]  # asserts in tests are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true
exclude = ["build", "dist", ".venv"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires external services",
    "slow: long-running benchmarks or volume tests",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
